<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Photo Gallery</title>
	<script>
        function pickimages() {
			 const images = [
				"picsresized2/cactusflowers1.jpeg",
				"picsresized2/yellowcactusflower4.jpeg",
				"picsresized2/redleavesinabowl3.jpeg",
				"picsresized2/yellowlemon5.jpeg",
				"picsresized2/whitelily.jpg",
				"picsresized2/pinkflowers2.jpeg",
				"picsresized2/puertoricanflags6.jpeg"
			 ];
			 const randomIndex = Math.floor(Math.random() * images.length);
			 document.getElementById("my-refresh-image").src = images[randomIndex];
        }
    </script>
    
	<link href="lightbox/lightbox.css" rel="stylesheet" />

	<link rel="stylesheet" href="css/style.css">
	<style>
		#img:hover {
			filter: blur(4px);
		}
	</style>
	<script src = "js/function.js"></script>
</head>
<!-- 4. Trigger the function when the page fully loads -->
<body onload="pickimages()">
